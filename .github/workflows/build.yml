name: Build and Check

on:
  push:
    branches: [ master, alevi ]
  pull_request:
    branches: [ master, alevi ]

jobs:
  build-linux:
    runs-on: ubuntu-20.04
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '5.15.2'
        host: 'linux'
        target: 'desktop'
        arch: 'gcc_64'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libcups2-dev libusb-1.0-0-dev libudev-dev libgl1-mesa-dev

    - name: Create build directory
      run: mkdir -p build

    - name: Run qmake
      run: |
        cd build
        qmake CONFIG+=release CONFIG+=SINGLEBIN ../sultan.pro

    - name: Build
      run: |
        cd build
        make -j$(nproc)

    - name: Deploy Qt dependencies
      run: |
        sudo apt-get install -y wget
        wget -q https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage
        chmod +x linuxdeployqt-continuous-x86_64.AppImage
        cd build/bin
        ../../linuxdeployqt-continuous-x86_64.AppImage Alevi -bundle-non-qt-libs -no-translations

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: alevi-linux
        path: build/bin/

  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '5.15.2'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Create build directory
      run: mkdir -p build

    - name: Run qmake
      run: |
        cd build
        qmake CONFIG+=release CONFIG+=SINGLEBIN ..\sultan.pro

    - name: Build
      run: |
        cd build
        nmake

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: alevi-windows
        path: build/bin/

  build-macos:
    runs-on: macos-13
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '5.15.2'
        host: 'mac'
        target: 'desktop'
        arch: 'clang_64'

    - name: Create build directory
      run: mkdir -p build

    - name: Run qmake
      run: |
        cd build
        qmake CONFIG+=release CONFIG+=SINGLEBIN ../sultan.pro

    - name: Build
      run: |
        cd build
        make -j$(sysctl -n hw.ncpu)

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: alevi-macos
        path: build/bin/
